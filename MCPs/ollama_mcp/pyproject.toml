[project]
name = "ollama-mcp"
version = "1.0.0"
description = "MCP server per gestione modelli Ollama con cache SQLite — Prismalux"
requires-python = ">=3.10"
dependencies = []   # solo stdlib: sqlite3, urllib, asyncio

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
