# Prismalux — requirements.lock
# Versioni verificate al 2026-06-13 sul sistema di sviluppo Linux (Python 3.14)
#
# Per rigenerare con hash SHA256 verificati da PyPI:
#   pip install pip-tools
#   pip-compile --generate-hashes requirements.txt -o requirements.lock
#
# Legenda:
#   [V] versione verificata sull'ambiente di sviluppo Linux
#   [W] versione verificata nell'embedded Python COMPILE_WIN (Windows)
#   [P] versione da PyPI — non ancora installata localmente

# ════════════════════════════════════════════════════════════════
# DIPENDENZE DI SISTEMA (non pip)
# ════════════════════════════════════════════════════════════════
#
# Installazione completa Linux (Ubuntu/Debian):
#   sudo apt install \
#     build-essential cmake git \
#     qt6-base-dev qt6-multimedia-dev qt6-webengine-dev \
#     libqt6sql6 libqt6bluetooth6 qt6-speech \
#     libqt6keychain1 qt6keychain-dev \
#     libonnxruntime-dev \
#     ffmpeg \
#     graphviz \
#     sqlite3 libsqlite3-dev \
#     openssl libssl-dev \
#     android-tools-adb \
#     ripgrep \
#     nmap whois traceroute dnsutils \
#     cppcheck \
#     python3-uno \
#     portaudio19-dev \
#     poppler-utils \
#     tesseract-ocr tesseract-ocr-ita \
#     imagemagick \
#     curl wget \
#     jq \
#     pipx
#
# Installazione Windows (MSYS2 UCRT64 — per Paolo):
#   pacman -S mingw-w64-ucrt-x86_64-{qt6-base,qt6-multimedia,cmake,ffmpeg,graphviz,sqlite3,openssl}
#   winget install Nmap.Nmap Cppcheck.Cppcheck ripgrep BurntSushi.ripgrep.MSVC
#
# Dettaglio per ogni pacchetto:
#
#   build-essential cmake    — compilatore C++ e build system GUI Qt6
#   git                      — controllo versione (obbligatorio)
#   qt6-base-dev             — Qt6 Core/Widgets/Network (GUI principale)
#   qt6-multimedia-dev       — Qt6::Multimedia (microfono, TTS Android)
#   qt6-webengine-dev        — Qt6::WebEngineWidgets (KaTeX LaTeX rendering)
#   libqt6sql6               — Qt6::Sql (quiz CCNA SQLite)
#   libqt6bluetooth6         — Qt6::Bluetooth (BLE chat Android)
#   qt6-speech               — Qt6::TextToSpeech (TTS Android voice loop)
#   qt6keychain-dev          — QKeychain (token LAN nel keyring di sistema)
#   libonnxruntime-dev       — ONNX Runtime (embedder RAG locale senza Python)
#   ffmpeg                   — audio/video: STT Whisper (estrazione WAV), MCP Multimedia
#   graphviz                 — rendering grafi DOT: GraphMemory, RagGraph, Multi-Agente
#   sqlite3 libsqlite3-dev   — database locale: GraphMemory, quiz CCNA, RAG graph
#   openssl libssl-dev       — TLS per LAN server, BLE AES-256-GCM
#   android-tools-adb        — ADB per MCP android-adb e deploy APK
#   ripgrep                  — grep veloce: MCP prismalux-search (grep_symbol)
#   nmap                     — port scanner: MCP network-recon
#   whois dnsutils traceroute — ricognizione rete: MCP network-recon
#   cppcheck                 — SAST C++: MCP sast (cppcheck_scan)
#   python3-uno              — LibreOffice UNO API (MCP office_bridge)
#   portaudio19-dev          — audio I/O: PyAudio (se usato per STT)
#   poppler-utils            — pdftotext, pdfinfo: alternativa a pdfminer
#   tesseract-ocr            — OCR immagini/PDF scansionati (futura feature)
#   tesseract-ocr-ita        — dizionario italiano per Tesseract
#   imagemagick              — conversione immagini batch
#   jq                       — parse JSON da shell — utile negli script bash
#   pipx                     — installazione isolata tool Python (bandit, pip-audit)
#   curl wget                — download file negli script (aggiorna.sh)
#
# Software applicativi (non da apt):
#   Ollama      — https://ollama.com/download  (LLM server porta 11434)
#   llama.cpp   — ENGINE_LLM/llama.cpp        (inference nativa porta 8081)
#   Blender     — blender.org                  (MCP blender_mcp porta 6789)
#   FreeCAD     — freecad.org                  (MCP freecad_mcp)
#   KiCAD       — kicad.org                    (MCP kicad_mcp)
#   GNS3        — gns3.com                     (MCP gns3_mcp)
#   Arduino CLI — arduino.github.io/arduino-cli (MCP tinymcp)
#   OBS Studio  — obsproject.com               (MCP obs_mcp WebSocket)
#   OpenCode    — github.com/opencode-ai       (porta 8092)
# ════════════════════════════════════════════════════════════════

