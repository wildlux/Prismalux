name: Build Windows

on:
  push:
    branches: [master]
    paths:
      - "gui/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: ""

      - name: Configure CMake
        working-directory: gui
        # CMAKE_SYSTEM_VERSION=10.0.22621.0: pinna il Windows SDK alla versione 22H2
        # per evitare il bug C2733 di SDK 10.0.26100.0 (windows-latest/Server 2025)
        # su _BitScanReverse64 (extern "C" in winnt.h vs intrinseche MSVC C++).
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_SYSTEM_VERSION=10.0.22621.0"

      - name: Build
        working-directory: gui
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Deploy Qt (windeployqt)
        shell: cmd
        working-directory: gui/build/Release
        run: windeployqt --release --no-translations Prismalux_GUI.exe

      - name: Create installer (CPack/NSIS)
        working-directory: gui/build
        run: cpack -C Release -G NSIS

      # OS-2: checksum per verifica integrità download
      - name: Compute SHA-256 checksum
        working-directory: gui/build
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 *.exe |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      - name: Upload portable (zip)
        uses: actions/upload-artifact@v4
        with:
          name: Prismalux-Windows-x64-portable
          path: gui/build/Release/
          retention-days: 14

      - name: Upload installer (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: Prismalux-Windows-x64-installer
          path: |
            gui/build/*.exe
            gui/build/SHA256SUMS-windows.txt
          retention-days: 14
