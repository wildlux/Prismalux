# OS-4: monitoraggio CVE nelle dipendenze — pip (50 requirements.txt degli MCP)
# + GitHub Actions. Le PR sono raggruppate per non inondare il repo.
version: 2
updates:
  # I 50 requirements.txt dei plugin MCP (glob supportato da dependabot v2)
  - package-ecosystem: pip
    directories:
      - "/MCPs/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      mcp-python-deps:
        patterns: ["*"]
    labels: [dependencies, python]

  # Requirements di Tools/scripts (se presenti) — root del repo
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies, python]

  # Azioni usate nei workflow CI
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
